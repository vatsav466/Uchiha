##############################################################################
# supervisord.conf — NOVEX process manager
#
# Process start order (priority, lowest number starts first):
#   10  redis       — cache layer (or skip if host Redis is already up)
#   20  api         — FastAPI/uvicorn backend (needs Redis)
#   30  nginx       — reverse proxy (needs api to be up for /docs proxy)
#
# The container is started with:
#   CMD ["/usr/bin/supervisord", "-n", "-c", "/etc/supervisor/conf.d/novex.conf"]
##############################################################################

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid
user=root

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ── Redis ─────────────────────────────────────────────────────────────────────
; When the container runs with --network host the host machine's Redis (port
; 6379) is directly reachable inside the container.  This wrapper detects
; whether Redis is already responding and skips starting a second instance.
;
; startsecs=0 is REQUIRED here: the "already-running" branch exits with 0
; in under a second.  With the default startsecs=1 supervisord would see that
; exit as a startup failure (BACKOFF → FATAL) regardless of exitcodes.
; Setting startsecs=0 tells supervisord to treat the process as "started"
; the instant it is spawned, so exit code 0 is accepted as a clean exit.
[program:redis]
command=bash -c "redis-cli -p 6379 ping 2>/dev/null | grep -q PONG && echo 'Redis already responding on :6379, skipping internal start' || exec redis-server --port 6379 --daemonize no --save '' --loglevel warning --dir /tmp --protected-mode no"
autostart=true
autorestart=unexpected
startsecs=0
exitcodes=0
startretries=1
priority=10
stdout_logfile=/var/log/redis.log
stderr_logfile=/var/log/redis.log
stdout_logfile_maxbytes=5MB
stopasgroup=true
killasgroup=true

; ── FastAPI backend (uvicorn via python -m urdhva_base) ───────────────────────
; HOST=0.0.0.0 binds uvicorn to all interfaces so port 8002 is reachable
; both from nginx (127.0.0.1) AND from outside the container directly.
[program:api]
command=/opt/venv/bin/python -m urdhva_base
directory=/opt/ceg/algo/api_manager
environment=PORT="8002",HOST="0.0.0.0",MODE="prod",PYTHONPATH="/opt/ceg/algo:/opt/ceg/algo/api_manager",ALG_ENV_PATH="/opt/ceg/algo/api_manager/.alg_env"
autostart=true
autorestart=true
; Give uvicorn 10 s to bind and log its first request line before supervisord
; considers the process "started". If it exits before 10 s it is restarted.
; (The remote had 5 s which was too short for slow container startups.)
startsecs=10
startretries=5
priority=20
stdout_logfile=/var/log/api.log
stderr_logfile=/var/log/api.log
stdout_logfile_maxbytes=10MB
stopasgroup=true
killasgroup=true

; ── Nginx ─────────────────────────────────────────────────────────────────────
; Nginx starts last (priority=30) so the FastAPI upstream is already bound
; before nginx tries to proxy /docs or /api/* on container start.
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
; Nginx binds quickly; 5 s is enough for supervisord to be confident it
; did not crash immediately.
startsecs=5
startretries=3
priority=30
stdout_logfile=/var/log/nginx_access.log
stderr_logfile=/var/log/nginx_error.log
stdout_logfile_maxbytes=10MB
stopasgroup=true
killasgroup=true
