##############################################################################
# fix-passwords.yml — ONE-TIME password salt re-encryption
#
# Run manually via workflow_dispatch to re-encrypt all user passwords in the
# database with the current password_salt from .alg_env so that login works.
#
# The new_password you provide here becomes the password for EVERY user whose
# stored password couldn't be decrypted (salt mismatch). Users whose stored
# password already decrypts correctly are left untouched.
##############################################################################
name: Fix Login - Reset Password Salt

on:
  workflow_dispatch:
    inputs:
      new_password:
        description: "New plain-text password for broken users (e.g. C@g-2O25#N0x$PRd)"
        required: true
        default: "C@g-2O25#N0x$PRd"

jobs:
  reset-passwords:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into server and reset all user passwords
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          command_timeout: 5m
          script: |
            set -e

            NEW_PW="${{ github.event.inputs.new_password }}"
            echo "==> Running password salt re-encryption inside app-container..."

            sudo docker exec app-container \
              /opt/venv/bin/python \
              /opt/ceg/algo/api_manager/reset_password.py \
              --all "${NEW_PW}"

            echo ""
            echo "==> Verifying: --check should show 0 broken users after reset"
            sudo docker exec app-container \
              /opt/venv/bin/python \
              /opt/ceg/algo/api_manager/reset_password.py --check

            echo ""
            echo "==> Testing login with admin..."
            HTTP_CODE=$(curl -s -o /tmp/login_resp.json \
              -w "%{http_code}" \
              -X POST http://localhost:5378/api/users/login \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"admin\",\"password\":\"${NEW_PW}\",\"login_type\":\"employee\"}")
            BODY=$(cat /tmp/login_resp.json)
            echo "HTTP: $HTTP_CODE  Body: $BODY"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Login PASSED — admin can log in with the new password"
            else
              echo "⚠️  Login returned HTTP $HTTP_CODE"
            fi

            echo ""
            echo "==> Testing login with superadmin..."
            HTTP_CODE2=$(curl -s -o /tmp/login_resp2.json \
              -w "%{http_code}" \
              -X POST http://localhost:5378/api/users/login \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"superadmin\",\"password\":\"${NEW_PW}\",\"login_type\":\"employee\"}")
            BODY2=$(cat /tmp/login_resp2.json)
            echo "HTTP: $HTTP_CODE2  Body: $BODY2"
            if [ "$HTTP_CODE2" = "200" ]; then
              echo "✅ Login PASSED — superadmin can log in"
            else
              echo "⚠️  superadmin login returned HTTP $HTTP_CODE2"
            fi

            echo ""
            echo "==> ✅ Password reset complete!"
            echo "    Username: admin       Password: ${NEW_PW}"
            echo "    Username: superadmin  Password: ${NEW_PW}"
