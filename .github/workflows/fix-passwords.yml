##############################################################################
# fix-passwords.yml — ONE-TIME password salt re-encryption
#
# Run this manually via workflow_dispatch to re-encrypt all user passwords
# in the database with the current password_salt from .alg_env.
#
# After this runs successfully, DELETE this workflow file (or keep it for
# future password resets — it is safe to leave; it only runs on manual trigger).
#
# Required inputs:
#   new_password — the plain-text password that EVERY user will be able to
#                  log in with after the reset. Choose a strong password.
#                  Individual users can change their password after logging in.
##############################################################################
name: Fix Login - Reset Password Salt

on:
  workflow_dispatch:
    inputs:
      new_password:
        description: "New plain-text password for ALL users (e.g. Admin@2025)"
        required: true
        default: "Admin@2025"

jobs:
  reset-passwords:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into server and reset all user passwords
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          command_timeout: 5m
          script: |
            set -e
            echo "==> Running password salt re-encryption inside app-container..."

            sudo docker exec app-container /opt/venv/bin/python \
              /opt/ceg/algo/api_manager/reset_password.py \
              --all '${{ github.event.inputs.new_password }}'

            echo ""
            echo "==> Verifying: --check should show 0 broken users after reset"
            sudo docker exec app-container /opt/venv/bin/python \
              /opt/ceg/algo/api_manager/reset_password.py --check

            echo ""
            echo "==> Testing login with superadmin..."
            RESULT=$(curl -s -X POST http://localhost:5378/api/users/login \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"superadmin\",\"password\":\"${{ github.event.inputs.new_password }}\",\"login_type\":\"employee\"}" \
              -w "\nHTTP: %{http_code}")
            echo "$RESULT"
            HTTP_CODE=$(echo "$RESULT" | tail -1 | awk '{print $2}')
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Login test PASSED — superadmin can log in"
            else
              echo "⚠️  Login test returned HTTP $HTTP_CODE — check superadmin username in DB"
            fi

            echo ""
            echo "==> ✅ Password reset complete!"
            echo "    All users can now log in with password: ${{ github.event.inputs.new_password }}"
