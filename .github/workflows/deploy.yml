name: Build and Deploy Application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          script: |
            set -e
            IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            echo "${{ secrets.GHCR_PAT }}" | sudo docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            sudo docker pull ${IMAGE}:latest
            sudo docker stop app-container || true
            sudo docker rm app-container || true
            sudo mkdir -p /opt/digitaltwin_images

            # Run container using host network mode for direct access to host services (Redis, Nginx)
            sudo docker run -d \
              --name app-container \
              --restart unless-stopped \
              --network host \
              -v /opt/digitaltwin_images:/opt/digitaltwin_images \
              ${IMAGE}:latest

            echo "Waiting for Nginx frontend..."
            for i in $(seq 1 15); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5378/ || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Frontend is up (HTTP $STATUS)"
                break
              fi
              echo "Frontend not ready (HTTP $STATUS), retrying ($i/15)..."
              sleep 5
              if [ "$i" -eq 15 ]; then
                echo "Frontend failed to start (last HTTP status: $STATUS)."
                sudo docker exec app-container supervisorctl -c /etc/supervisor/supervisord.conf status || true
                sudo docker exec app-container tail -n 100 /var/log/api.log || true
                sudo docker logs app-container
                exit 1
              fi
            done

            echo "Waiting for FastAPI backend services to load all route routers..."
            for i in $(seq 1 20); do
              DOCS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5378/docs || echo "000")
              OPENAPI_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5378/openapi.json || echo "000")
              
              if [ "$DOCS_STATUS" = "200" ] && [ "$OPENAPI_STATUS" = "200" ]; then
                echo "FastAPI backend active: Swagger UI (HTTP $DOCS_STATUS), OpenAPI schema (HTTP $OPENAPI_STATUS)"
                break
              fi
              
              echo "FastAPI endpoints initializing... Docs: $DOCS_STATUS, Schema: $OPENAPI_STATUS ($i/20)"
              sleep 3
              
              if [ "$i" -eq 20 ]; then
                echo "FastAPI failed to serve docs/schema within timeout."
                echo "--- Supervisor Service Status ---"
                sudo docker exec app-container supervisorctl -c /etc/supervisor/supervisord.conf status || true
                echo "--- FastAPI Application Log ---"
                sudo docker exec app-container cat /var/log/api.log || true
                echo "--- Container Console Output ---"
                sudo docker logs app-container
                exit 1
              fi
            done

            echo "Verifying API proxy route..."
            API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5378/api/ || echo "000")
            echo "API Proxy endpoint responded with HTTP $API_STATUS"

            echo "Pruning unused docker images..."
            sudo docker image prune -f
