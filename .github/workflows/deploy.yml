name: Build and Deploy Application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy to target server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          script: |
            set -e
            IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            echo "Logging into container registry..."
            echo "${{ secrets.GHCR_PAT }}" | sudo docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            echo "Pulling latest Docker image..."
            sudo docker pull ${IMAGE}:latest

            echo "Stopping old application container..."
            sudo docker stop app-container || true
            sudo docker rm app-container || true
            sudo mkdir -p /opt/digitaltwin_images

            echo "Launching new container on host network..."
            sudo docker run -d \
              --name app-container \
              --restart unless-stopped \
              --network host \
              -v /opt/digitaltwin_images:/opt/digitaltwin_images \
              ${IMAGE}:latest

            echo "================================================="
            echo "STAGE 1: Verifying Nginx Frontend (Port 5378)..."
            echo "================================================="
            for i in $(seq 1 20); do
              FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5378/ || echo "000")
              if [ "$FRONTEND_STATUS" = "200" ]; then
                echo "✅ NOVEX Dashboard is live at http://165.101.248.89:5378/ (HTTP $FRONTEND_STATUS)"
                break
              fi
              echo "Waiting for Nginx (HTTP $FRONTEND_STATUS), retry ($i/20)..."
              sleep 3
              if [ "$i" -eq 20 ]; then
                echo "❌ Nginx frontend failed to respond."
                sudo docker exec app-container supervisorctl status || true
                sudo docker exec app-container cat /var/log/api.log || true
                sudo docker logs app-container
                exit 1
              fi
            done

            echo "================================================="
            echo "STAGE 2: Verifying FastAPI Backend & Route Registration..."
            echo "================================================="
            for i in $(seq 1 20); do
              DOCS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5378/docs || echo "000")
              if [ "$DOCS_STATUS" = "200" ] || [ "$DOCS_STATUS" = "307" ]; then
                echo "✅ FastAPI Swagger UI reachable via Nginx at http://165.101.248.89:5378/docs (HTTP $DOCS_STATUS)"
                break
              fi
              echo "FastAPI backend warming up (HTTP $DOCS_STATUS), retrying ($i/20)..."
              sleep 3
              if [ "$i" -eq 20 ]; then
                echo "❌ FastAPI Swagger UI failed on port 5378/docs."
                sudo docker exec app-container supervisorctl status || true
                sudo docker exec app-container cat /var/log/api.log || true
                sudo docker logs app-container
                exit 1
              fi
            done

            echo "================================================="
            echo "STAGE 3: Checking Direct FastAPI Port Exposure (Port 8002)..."
            echo "================================================="
            DIRECT_DOCS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8002/docs || echo "000")
            if [ "$DIRECT_DOCS_STATUS" = "200" ] || [ "$DIRECT_DOCS_STATUS" = "307" ]; then
              echo "✅ Direct FastAPI docs accessible at http://165.101.248.89:8002/docs (HTTP $DIRECT_DOCS_STATUS)"
            else
              echo "⚠️ Notice: Direct port 8002 returned HTTP $DIRECT_DOCS_STATUS (Traffic routed safely via Nginx on 5378)"
            fi

            echo "================================================="
            echo "STAGE 4: Verifying OpenAPI JSON Schema..."
            echo "================================================="
            OPENAPI_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5378/openapi.json || echo "000")
            if [ "$OPENAPI_STATUS" = "200" ]; then
              echo "✅ All OpenAPI schema routes loaded successfully!"
            else
              echo "⚠️ openapi.json returned HTTP $OPENAPI_STATUS"
            fi

            echo "Pruning unused images..."
            sudo docker image prune -f
