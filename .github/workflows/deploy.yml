name: Build and Deploy Application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          script: |
            set -e
            IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            echo "${{ secrets.GHCR_PAT }}" | sudo docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            sudo docker pull ${IMAGE}:latest
            sudo docker stop app-container || true
            sudo docker rm app-container || true
            sudo mkdir -p /opt/digitaltwin_images

            # Run container using host networking mode
            sudo docker run -d \
              --name app-container \
              --restart unless-stopped \
              --network host \
              -v /opt/digitaltwin_images:/opt/digitaltwin_images \
              ${IMAGE}:latest

            echo "Waiting for Nginx / Frontend to respond..."
            for i in $(seq 1 20); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5378/ || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Frontend server is UP (HTTP $STATUS)"
                break
              fi
              echo "Frontend loading (HTTP $STATUS), retry ($i/20)..."
              sleep 5
              if [ "$i" -eq 20 ]; then
                echo "Frontend service failed to start."
                sudo docker exec app-container supervisorctl -c /etc/supervisor/supervisord.conf status || true
                sudo docker exec app-container cat /var/log/api.log || true
                sudo docker logs app-container
                exit 1
              fi
            done

            echo "Allowing FastAPI services and Redis to fully register all endpoints..."
            sleep 5

            echo "Verifying FastAPI Swagger UI..."
            DOCS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5378/docs || echo "000")
            if [ "$DOCS_STATUS" = "200" ] || [ "$DOCS_STATUS" = "307" ]; then
              echo "Swagger UI reachable (HTTP $DOCS_STATUS)"
            else
              echo "FastAPI Swagger endpoint unreachable (HTTP $DOCS_STATUS)."
              echo "=== Supervisor Status ==="
              sudo docker exec app-container supervisorctl -c /etc/supervisor/supervisord.conf status || true
              echo "=== Backend API Log Output ==="
              sudo docker exec app-container cat /var/log/api.log || true
              echo "=== Container Logs ==="
              sudo docker logs app-container
              exit 1
            fi

            echo "Checking complete OpenAPI endpoints generation (/openapi.json)..."
            OPENAPI_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5378/openapi.json || echo "000")
            if [ "$OPENAPI_STATUS" = "200" ]; then
              echo "All FastAPI endpoints schema loaded successfully! (HTTP $OPENAPI_STATUS)"
            else
              echo "Warning: openapi.json returned HTTP $OPENAPI_STATUS"
            fi

            echo "Cleaning up dangling images..."
            sudo docker image prune -f
