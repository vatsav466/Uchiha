name: Build and Deploy Application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ── Job 1: Build Docker image and push to GHCR ──────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: Deploy to production server ──────────────────────────────────────
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          command_timeout: 15m
          # IMPORTANT: store the *contents* of your .alg_env file as a GitHub
          # secret called ALG_ENV_CONTENT (Settings → Secrets → Actions).
          # That's what actually fixes the "password authentication failed
          # for user root" error — your DB creds were never reaching the
          # container before because nothing mounted the env file.
          envs: ALG_ENV_CONTENT
          script: |
            set -e
            IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            echo "==> Image: ${IMAGE}:latest"
            # ── Write the real env/credentials file on the host ────────────────
            sudo mkdir -p /opt/ceg/algo/api_manager
            echo "${ALG_ENV_CONTENT}" | sudo tee /opt/ceg/algo/api_manager/.alg_env > /dev/null
            sudo chmod 600 /opt/ceg/algo/api_manager/.alg_env
            # ── Pull latest image ─────────────────────────────────────────────
            echo "${{ secrets.GHCR_PAT }}" | sudo docker login ghcr.io \
              -u "${{ github.actor }}" --password-stdin
            sudo docker pull ${IMAGE}:latest
            # ── Replace the running container ─────────────────────────────────
            sudo docker stop app-container 2>/dev/null || true
            sudo docker rm   app-container 2>/dev/null || true
            sudo mkdir -p /opt/digitaltwin_images
            sudo docker run -d \
              --name app-container \
              --restart unless-stopped \
              --network host \
              -v /opt/digitaltwin_images:/opt/digitaltwin_images \
              -v /opt/ceg/algo/api_manager/.alg_env:/opt/ceg/algo/api_manager/.alg_env:ro \
              ${IMAGE}:latest
            # ── Stage 1: wait for nginx / frontend (max 180s) ─────────────────
            echo "==> Waiting for frontend on :5378 ..."
            for i in $(seq 1 36); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5378/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ Frontend live — http://165.101.248.89:5378/ (HTTP $STATUS)"
                break
              fi
              echo "   attempt $i/36 — HTTP $STATUS"
              sleep 5
              if [ "$i" -eq 36 ]; then
                echo "❌ Frontend did not start within 180s — dumping logs"
                sudo docker exec app-container supervisorctl -c /etc/supervisor/conf.d/novex.conf status || true
                sudo docker exec app-container tail -n 100 /var/log/api.log || true
                sudo docker logs --tail 100 app-container
                exit 1
              fi
            done
            # ── Stage 2: wait for FastAPI to become truly ready (max 300s) ────
            echo "==> Waiting for FastAPI backend on :8002 ..."
            BACKEND_OK="no"
            for i in $(seq 1 60); do
              API=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5378/api/health || echo "000")
              DIRECT=$(curl -s -o /dev/null -w "%{http_code}" -L http://127.0.0.1:8002/docs || echo "000")
              if [ "$API" = "200" ] && [ "$DIRECT" = "200" ]; then
                echo "✅ FastAPI ready — /api/health HTTP $API, :8002/docs HTTP $DIRECT"
                BACKEND_OK="yes"
                break
              fi
              echo "   attempt $i/60 — /api/health=$API  :8002/docs=$DIRECT (backend warming up)"
              sleep 5
            done
            if [ "$BACKEND_OK" != "yes" ]; then
              echo "❌ FastAPI backend never became ready within 300s"
              echo "--- supervisor status ---"
              sudo docker exec app-container supervisorctl -c /etc/supervisor/conf.d/novex.conf status || true
              echo "--- api.log tail ---"
              sudo docker exec app-container tail -n 200 /var/log/api.log || true
              echo "--- full container logs ---"
              sudo docker logs --tail 200 app-container
              exit 1
            fi
            # ── Stage 3: verify the remaining routes ──────────────────────────
            DOCS=$(curl -s -o /dev/null -w "%{http_code}" -L http://127.0.0.1:5378/docs || echo "000")
            if [ "$DOCS" = "200" ]; then
              echo "✅ Swagger UI — http://165.101.248.89:5378/docs (HTTP $DOCS)"
            else
              echo "❌ /docs returned HTTP $DOCS"
              sudo docker exec app-container tail -n 200 /var/log/api.log || true
              exit 1
            fi
            OAS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5378/openapi.json || echo "000")
            if [ "$OAS" = "200" ]; then
              echo "✅ OpenAPI schema — http://165.101.248.89:5378/openapi.json (HTTP $OAS)"
            else
              echo "❌ /openapi.json returned HTTP $OAS"
              sudo docker exec app-container tail -n 200 /var/log/api.log || true
              exit 1
            fi
            # ── Done ──────────────────────────────────────────────────────────
            echo ""
            echo "✅ Deployment complete — http://165.101.248.89:5378/ and http://165.101.248.89:8002/docs"
            sudo docker exec app-container supervisorctl -c /etc/supervisor/conf.d/novex.conf status || true
            sudo docker image prune -f
