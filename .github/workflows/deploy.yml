name: Build and Deploy Application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ── Job 1: Build Docker image and push to GHCR ──────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: Deploy to production server ──────────────────────────────────────
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            set -e

            IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            echo "==> Image: ${IMAGE}:latest"

            # Pull latest image
            echo "${{ secrets.GHCR_PAT }}" | sudo docker login ghcr.io \
              -u "${{ github.actor }}" --password-stdin
            sudo docker pull ${IMAGE}:latest

            # Stop and remove old container
            sudo docker stop app-container 2>/dev/null || true
            sudo docker rm   app-container 2>/dev/null || true
            sudo mkdir -p /opt/digitaltwin_images

            # Start new container
            sudo docker run -d \
              --name app-container \
              --restart unless-stopped \
              --network host \
              -v /opt/digitaltwin_images:/opt/digitaltwin_images \
              ${IMAGE}:latest

            # ── Wait for nginx to become ready (max 120s) ────────────────────
            echo "==> Waiting for http://165.101.248.89:5378/ ..."
            for i in $(seq 1 24); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5378/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ Frontend is live at http://165.101.248.89:5378/ (HTTP $STATUS)"
                break
              fi
              echo "   attempt $i/24 — HTTP $STATUS"
              sleep 5
              if [ "$i" -eq 24 ]; then
                echo "❌ Frontend did not start within 120s"
                sudo docker exec app-container supervisorctl status || true
                sudo docker exec app-container tail -n 100 /var/log/api.log || true
                sudo docker logs --tail 100 app-container
                exit 1
              fi
            done

            # ── Verify Swagger UI at http://165.101.248.89:5378/docs ─────────
            DOCS=$(curl -s -o /dev/null -w "%{http_code}" -L http://127.0.0.1:5378/docs || echo "000")
            [ "$DOCS" = "200" ] \
              && echo "✅ Swagger UI — http://165.101.248.89:5378/docs (HTTP $DOCS)" \
              || echo "⚠️  /docs returned HTTP $DOCS"

            # ── Verify FastAPI direct at http://165.101.248.89:8002/docs ─────
            DIRECT=$(curl -s -o /dev/null -w "%{http_code}" -L http://127.0.0.1:8002/docs || echo "000")
            [ "$DIRECT" = "200" ] \
              && echo "✅ FastAPI direct — http://165.101.248.89:8002/docs (HTTP $DIRECT)" \
              || echo "⚠️  :8002/docs returned HTTP $DIRECT"

            # ── Verify OpenAPI schema ─────────────────────────────────────────
            OAS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5378/openapi.json || echo "000")
            [ "$OAS" = "200" ] \
              && echo "✅ OpenAPI schema — http://165.101.248.89:5378/openapi.json (HTTP $OAS)" \
              || echo "⚠️  /openapi.json returned HTTP $OAS"

            # ── Done ──────────────────────────────────────────────────────────
            echo ""
            echo "✅ Deployment complete — http://165.101.248.89:5378/"
            sudo docker exec app-container supervisorctl status || true
            sudo docker image prune -f
