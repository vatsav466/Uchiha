name: Build and Deploy Application
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          script: |
            set -e
            IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            echo "${{ secrets.GHCR_PAT }}" | sudo docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            sudo docker pull ${IMAGE}:latest
            sudo docker stop app-container || true
            sudo docker rm app-container || true
            sudo mkdir -p /opt/digitaltwin_images

            # --network host is required: the api process connects to Redis
            # at localhost:6379, which is the HOST's Redis. Without
            # --network host, "localhost" inside the container has no
            # Redis listening on it and the api process fails to start
            # (this was the actual cause of the repeated "exit status 1"
            # crash loop and the resulting HTTP 500s from nginx).
            sudo docker run -d \
              --name app-container \
              --restart unless-stopped \
              --network host \
              -v /opt/digitaltwin_images:/opt/digitaltwin_images \
              ${IMAGE}:latest

            echo "Waiting for application..."
            for i in $(seq 1 15); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5378/ || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Frontend is up (HTTP $STATUS)"
                break
              fi
              echo "Not ready yet (HTTP $STATUS), retrying ($i/15)..."
              sleep 5
              if [ "$i" -eq 15 ]; then
                echo "Frontend failed to start (last HTTP status: $STATUS)."
                echo "--- Checking if frontend files exist in container ---"
                sudo docker exec app-container ls -la /usr/share/nginx/html || echo "Path /usr/share/nginx/html not found in container"
                echo "--- nginx config test ---"
                sudo docker exec app-container nginx -t || true
                echo "--- supervisord process status ---"
                sudo docker exec app-container supervisorctl status || true
                echo "--- api process log tail ---"
                sudo docker exec app-container tail -n 100 /var/log/api.log || true
                echo "--- Full container logs ---"
                sudo docker logs app-container
                exit 1
              fi
            done

            echo "Checking Swagger..."
            DOCS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5378/docs || echo "000")
            if [ "$DOCS_STATUS" = "000" ] || [ "$DOCS_STATUS" = "404" ]; then
              echo "Swagger endpoint unreachable or missing (HTTP $DOCS_STATUS)."
              sudo docker exec app-container supervisorctl status || true
              sudo docker exec app-container tail -n 100 /var/log/api.log || true
              sudo docker logs app-container
              exit 1
            else
              echo "Swagger endpoint reachable (HTTP $DOCS_STATUS)"
            fi

            echo "Checking API proxy..."
            API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5378/api/ || echo "000")
            echo "API endpoint responded with HTTP $API_STATUS"

            sudo docker image prune -f
