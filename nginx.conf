##############################################################################
# nginx.conf — NOVEX production reverse-proxy
#
# Listens on :5378 (mapped to the host or exposed to the internet).
# FastAPI (uvicorn) listens on 127.0.0.1:8002 inside the same container.
#
# Routes:
#   /health          → inline 200 OK  (Docker / CI healthcheck)
#   /api/…           → FastAPI backend
#   /docs, /docs/    → FastAPI Swagger UI
#   /redoc, /redoc/  → FastAPI ReDoc UI
#   /openapi.json    → FastAPI OpenAPI schema
#   /                → Vite/React SPA (try_files → index.html)
##############################################################################

server {
    listen 5378;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large file uploads (CSV / image imports)
    client_max_body_size 100m;

    # ── Timeouts (prevent 504 on slow first-boot and long API calls) ──────
    proxy_connect_timeout  60s;
    proxy_send_timeout     300s;
    proxy_read_timeout     300s;
    send_timeout           120s;

    # ── Health-check endpoint ─────────────────────────────────────────────
    # Used by Docker HEALTHCHECK and the GitHub Actions deploy script.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ── FastAPI: API routes ───────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8002;
        proxy_http_version 1.1;

        # WebSocket / SSE upgrade support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard reverse-proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass JWT / session tokens and cookies through unchanged
        proxy_set_header  Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_set_header  Cookie        $http_cookie;
        proxy_pass_header Cookie;

        proxy_cache_bypass $http_upgrade;
        proxy_redirect     off;

        # CORS pre-flight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  '*'                                                                                  always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH'                                             always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age'       1728000;
            add_header 'Content-Type'                 'text/plain; charset=utf-8';
            add_header 'Content-Length'               0;
            return 204;
        }
    }

    # ── FastAPI: Swagger UI (/docs and /docs/) ────────────────────────────
    # FastAPI redirects /docs → /docs/ (307). Both must be proxied so the
    # browser follows the redirect correctly through nginx.
    location /docs {
        proxy_pass         http://127.0.0.1:8002/docs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
    }

    location /docs/ {
        proxy_pass         http://127.0.0.1:8002/docs/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
    }

    # ── FastAPI: ReDoc UI ─────────────────────────────────────────────────
    location /redoc {
        proxy_pass         http://127.0.0.1:8002/redoc;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
    }

    location /redoc/ {
        proxy_pass         http://127.0.0.1:8002/redoc/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
    }

    # ── FastAPI: OpenAPI JSON schema ──────────────────────────────────────
    location = /openapi.json {
        proxy_pass         http://127.0.0.1:8002/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
    }

    # ── Vite static assets: aggressive caching ────────────────────────────
    # Vite hashes filenames (e.g. index-BxY2kZ.js) — safe to cache forever.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── React SPA (catch-all) ─────────────────────────────────────────────
    # Any path not matched above falls through to index.html so that
    # React Router can handle client-side navigation.
    # MUST be last so the more-specific blocks above take priority.
    #
    # index.html is served with no-cache so a deployed bundle is never
    # missed: after an image update the hashed asset URLs change, and a
    # cached index.html referencing the old hashes would 404 the JS and
    # render a white page. no-store forces the browser to always fetch the
    # latest index.html, which then points at the current hashed bundles.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Explicit /index.html — same no-cache guarantee as the SPA catch-all.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }
}
